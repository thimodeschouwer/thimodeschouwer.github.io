main:

  - title: Work Meaning and the <i> Flexibility Puzzle </i>
    authors: with <a href = "https://sites.google.com/site/kesternichiris/home" > Iris Kesternich </a>
    pdf: ./assets/files/MeaningFlexibilityPuzzle.pdf
    abstract: >-
      We study heterogeneity in the prevalence of and preferences for workplace flexibility and work meaning. We show that, internationally, women and parents value flexibility more but do not work more flexible jobs. The gender dimension of this flexibility puzzle is related to differences in meaningful work, which women value higher and sort into, at a significant price corresponding to 20 to 70% less flexibility. The parental dimension is connected to preferences for meaning and flexibility diverging after childbirth. We show through counterfactuals that making meaningful jobs more flexible reduces the gender gap in total compensation by almost a quarter.
    slides: ./assets/files/MeaningFlexibilityPuzzlePres.pdf
    replication: https://github.com/thimodeschouwer/replication-meaningflexibilitypuzzle
    outreach:
      - title: Meaningful work at the expense of family life? (HCHE, 2026)
        url: https://www.hche.uni-hamburg.de/en/aktuelles/2026/2026-01-27-pm-meaningfuljobs.html
      - title: The Flexibility Puzzle (CESifo Newsletter, 2024)
        url: https://www.ifo.de/cesifo/newsletter/0524/CESifo_Newsletter_Issue_202405.html?cesifoNL202405
      - title: Zinvol Werk en de Flexibiliteitspuzzel (LES, 2024)
        url: https://feb.kuleuven.be/research/LES/pdf/LES2024-219.pdf
    journal: Journal of Labor Economics
    journal_link: https://www.journals.uchicago.edu/toc/jole/current
